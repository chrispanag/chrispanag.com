baseURL: "https://chrispanag.com/"
title: Christos Panagiotakopoulos
theme: [PaperMod]

enableRobotsTXT: true
enableInlineShortcodes: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "about"]

googleAnalytics: "G-5TRQBY0Y8M"

minify:
  disableXML: true
  minifyOutput: true

# llms.txt: a plain-text index of the site for LLM consumption.
# See https://llmstxt.org/ — generated from layouts/home.llms.txt (that exact name
# matters, see CLAUDE.md), which calls the section printer the theme defines.
outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true
  # openapi.json: an OpenAPI 3.1 description of the machine-readable endpoints this
  # site serves (llms.txt, sitemap.xml, index.json, index.xml) plus its 404 contract.
  # Generated from layouts/home.openapi.json (that exact name matters, see CLAUDE.md).
  # isPlainText keeps html/template from escaping the JSON; notAlternative keeps it
  # out of the <link rel="alternate"> list in <head>.
  openapi:
    mediaType: "application/json"
    baseName: "openapi"
    isPlainText: true
    notAlternative: true

outputs:
  # JSON powers the Fuse.js search index (index.json); do not remove it.
  home: ["HTML", "RSS", "llms", "JSON", "openapi"]

pagination:
  disableAliases: false
  pagerSize: 5

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Christos Panagiotakopoulos
  description: "Engineering Manager at Prelude (ex-BeReal). I build backend and platform systems at scale, and the teams behind them."
  keywords: [christos panagiotakopoulos, engineering manager, software engineer, backend, platform engineering, golang, nodejs, prelude, bereal, web3, capsule social, blogchain]
  author: Christos Panagiotakopoulos
  # default image used for opengraph / twitter-cards on pages without their own cover
  images: ["profile.jpeg"]

  # Mark up the site as a Person (not an Organization) for richer structured data.
  # Everything below feeds the home page's JSON-LD graph, emitted by the project's
  # copy of layouts/_partials/templates/schema_json.html. The home page is deliberately
  # sparse for readers, so this is how an agent or a search engine learns who the site
  # is about. Keep it factual: it is a public claim about a real person.
  schema:
    publisherType: "Person"
    jobTitle: "Engineering Manager"
    worksFor:
      name: "Prelude"
      url: "https://prelude.so"
    homeLocation: "Paris, France"
    knowsAbout:
      - "Backend engineering"
      - "Platform engineering"
      - "Distributed systems"
      - "Go"
      - "Node.js"
      - "API design"
      - "Phone verification"
      - "Anti-fraud systems"
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: "Home"
    icon: /favicon-32x32.png # "C" mark (apple-touch-icon is the profile illustration)
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Christos Panagiotakopoulos
    subtitle: "Engineering Manager @ [Prelude](https://prelude.so) | ex-BeReal"
    imageUrl: "profile.jpeg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: profile picture
    buttons:
      - name: Blog
        url: posts
      - name: About
        url: about
      - name: On the web
        url: chrispanag-on-the-web

  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/chrispanag/"
    - name: github
      url: "https://github.com/chrispanag"
    - name: x
      url: "https://x.com/chrispanag"

  # Google Search Console verification. Paste the HTML-tag token from
  # Search Console here — this is NOT the GA4 measurement ID (G-XXXX).
  # analytics:
  #   google:
  #     SiteVerificationTag: ""

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/chrispanag/chrispanag.com/edit/main/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: aboutme
      name: about me
      url: /about
      weight: 5
    - identifier: ontheweb
      name: me on the web
      url: /chrispanag-on-the-web
      weight: 5
    - identifier: blog
      name: blog
      url: /posts
      weight: 7
    - identifier: search
      name: search
      url: /search
      weight: 9
    # - identifier: example
    #   name: example.org
    #   url: https://example.org
    #   weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma

markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
